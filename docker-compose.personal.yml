# Deploy pessoal: build local (sem Docker Hub) + Postgres + MinIO opcional.
#
# Uso:
#   pnpm setup:personal
#   docker compose -f docker-compose.personal.yml up -d --build
#
# Com anexos (MinIO):
#   docker compose -f docker-compose.personal.yml --profile attachments up -d --build
#
# Dev com hot-reload (recomendado para anexos no browser):
#   docker compose -f docker-compose.personal.yml up -d db
#   docker compose -f docker-compose.personal.yml --profile attachments up -d minio minio-init
#   pnpm dev

name: openmonetis-personal

services:
  db:
    image: postgres:18-alpine
    container_name: openmonetis_personal_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openmonetis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-openmonetis_db}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-openmonetis} -d ${POSTGRES_DB:-openmonetis_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    profiles: ["attachments"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: openmonetis_personal_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openmonetis_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    profiles: ["attachments"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: openmonetis_personal_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openmonetis_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env}
      S3_BUCKET: ${S3_BUCKET:-openmonetis-attachments}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$S3_BUCKET &&
      exit 0
      "

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: openmonetis:personal-local
    container_name: openmonetis_personal_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-openmonetis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openmonetis_db}
      PERSONAL_DEPLOYMENT: "true"
      DISABLE_SIGNUP: "true"
      DISABLE_UPDATE_CHECK: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
